[workspace]
resolver = "2"
members = [
    "crates/gnomon-surface",
    "crates/gnomon-edit",
    "crates/gnomon-exec",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tempfile = "3"
toml = "0.8"
walkdir = "2.5"

[profile.release]
opt-level = 3
