[workspace]
resolver = "2"
members = [
    "crates/gnomon-surface",
    "crates/gnomon-edit",
    "crates/gnomon-exec",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Elja Placido <digicisu@gmail.com>"]
repository = "https://github.com/eljaplacido/gnomonharness"

# Every entry here must be used by a member crate. A [workspace.dependencies]
# entry that nobody references never reaches Cargo.lock, so it is not pinned,
# not audited, not resolved and not built -- it only looks like it is.
# Measured: `toml = "0.8"` sat here while `grep -rn 'toml::' crates/` matched
# nothing and no member listed it, and `grep -n toml Cargo.lock` returned no
# lines at all. A dependency the lockfile has never heard of is a claim about
# the build with nothing behind it, and it is exactly the sort of thing a
# reader trusts on sight.
[workspace.dependencies]
sha2 = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
tempfile = "3"
walkdir = "2.5"

[profile.release]
opt-level = 3
