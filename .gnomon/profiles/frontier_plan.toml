# Profile: frontier_plan
# Use frontier for plan + implement. Critique stays local separate context.

[profile]
name = "frontier_plan"
role_profile = "frontier_plan"

[roles.plan]
model = "frontier:remote"
temperature = 0.1

[roles.implement]
model = "frontier:remote"
temperature = 0.3

[roles.critique]
model = "local:large:separate"
temperature = 0.1

[roles.smol]
model = "local:small"
temperature = 0.2
