# local_first — everything on this machine, nothing billed.
#
# Rewritten 2026-09-03. This file previously carried placeholder model tags
# (`frontier:remote`, `local:large`) under a header reading "NOT READ BY ANY
# CODE PATH" — true at the time, and the reason the tags were never real. Now
# that profiles ARE applied, every value here has to be one an endpoint serves,
# because a profile that names a model nothing can run is worse than no profile.

[profile]
name = "local_first"
description = "Every role on the local endpoint. No key, no bill, no network."

[roles.plan]
model = "qwen3.6:35b"
endpoint = "local"

[roles.implement]
model = "qwen3.6:35b"
endpoint = "local"
