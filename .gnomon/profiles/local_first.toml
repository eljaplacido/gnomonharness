# NOT READ BY ANY CODE PATH. `role_profile` and this directory are published
# in the enumerations contract and nothing consumes them: no code selects a
# profile, and roleDef.profile is used as a model tag. Kept because removing a
# published enumeration value is a contract change; disclosed here so a reader
# does not tune something that cannot move. See docs/CONTRACTS.md.
# Profile: local_first
# Prefer local models for implement + critique, frontier only for plan.

[profile]
name = "local_first"
role_profile = "local_first"

[roles.plan]
model = "frontier:remote"
temperature = 0.2

[roles.implement]
model = "local:large"
temperature = 0.3

[roles.critique]
model = "local:large:separate"
temperature = 0.1

[roles.smol]
model = "local:small"
temperature = 0.2
