# Policy: approval gates, sandbox level, edit format.

[approval]
gate = "on_write"                  # never | on_write | always
auto_merge = false                 # whether to auto-merge approved edits
reject_on_disagreement = false     # if critic disagrees, halt or continue

[sandbox]
level = "confined"                 # off | confined | strict
network = false                    # block network in confined/strict?
env_isolation = true               # clone env before write?

[edit]
format = "hashline"                # ast | hashline | str_replace
min_line_context = 3               # surrounding lines for hashline anchors
preserve_formatting = true
