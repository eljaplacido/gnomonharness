# Declared tools and MCP servers. Each pinned.
#
# This file used to say, on this line: "Unreachable servers produce a refusal —
# never a shorter tool list." That sentence was false, and the code cannot be
# changed from here, so it is replaced with what connectMcp actually does
# (packages/gnomon-core/src/mcp.ts, read 2026-09-02):
#
#   A server that fails to spawn or fails the handshake is CAUGHT. One line is
#   printed at startup — `mcp: <name> unavailable — <reason>` — the connection
#   is closed, and the loop continues. That server's tools are simply absent
#   from the tool list handed to the model. The model is never told, and no
#   refusal naming the server is ever produced: it sees a shorter list and has
#   no way to know one existed.
#
# The claim was worth deleting rather than softening. It described the single
# behaviour that would have made a missing server visible to the model, and the
# code does the opposite — so a reader who trusted it would conclude a server
# had connected because nothing refused. A surface sentence describing a control
# that does not exist is the same failure as a setting nothing reads.
#
# The only refusal on that path fires when a model names an unconnected tool
# (`MCP tool "x" is not connected.`), which will not happen, because the tool
# was never offered to it.
#
# What to do instead: read the startup lines. A declared server that does not
# appear there did not connect, and the session is running with fewer tools than
# this file declares.
#
# gnomon's own tools — the [[tools]] blocks below — are different, and do refuse
# by name: a tool a role may not call comes back as
# `Refused: "<name>" is not available to this role.` (tools.ts).

[[tools]]
name = "read"
description = "Read a file as numbered lines, or list a directory. Text only."
enabled = true

[[tools]]
name = "bash"
description = "Execute a POSIX sh command (/bin/sh, not bash: no pipefail, [[ ]] or arrays). Runs in the project root every time — cd does not persist between calls, so use absolute paths. To leave a service running past the call, detach it: setsid cmd </dev/null >/tmp/svc.log 2>&1 &"
enabled = true
timeout_seconds = 120

[[tools]]
name = "todo"
description = "Keep a checklist for this session. Replace the whole list each time."
enabled = true

[[tools]]
name = "task"
description = "Run a sub-turn under another role, with its own context. It gets that role's tools."
enabled = true

# Reaches the network, so it is gated like a write and refused outright when
# [sandbox] network = false in policy.toml. Off by default for that reason.
[[tools]]
name = "webfetch"
description = "Retrieve an http(s) URL as text"
enabled = false

[[tools]]
name = "compute"
description = "Evaluate arithmetic exactly. Use this instead of calculating in your head."
enabled = true

[[tools]]
name = "glob"
description = "Find files by path pattern, e.g. **/*.ts"
enabled = true

[[tools]]
name = "grep"
description = "Find lines matching a regular expression. Returns path:line:text. Never searches build or dependency trees (node_modules, target, dist, build, vendor, .git) or binary files — a zero result means 'not in tracked source'."
enabled = true

[[tools]]
name = "edit"
description = "Make precise text replacements with exact text matching"
enabled = true

[[tools]]
name = "write"
description = "Create or overwrite files"
enabled = true

[[tools]]
name = "skill"
description = "Propose a skill: a durable note about how to work in this repository"
enabled = true

# MCP servers — each referenced by name, never by value.
#
# Stdio MCP is wired: a declared server is spawned at startup, its tools are
# discovered and offered as mcp__<server>__<tool>, and a role must name the tool
# or its server to receive it. Reachable from `gnomon prompt` and `gnomon task`
# alike -- it was interactive-only for a while, which made a declared server
# look broken from the entry point every script uses. Capability comes from what
# gnomon implements, not from what a model can do.
# [mcp_servers.example]
# name = "example-server"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@example/mcp-server"]
