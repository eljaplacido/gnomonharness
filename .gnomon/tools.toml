# Declared tools and MCP servers. Each pinned.
# Unreachable servers produce a refusal — never a shorter tool list.

[[tools]]
name = "read"
description = "Read file contents (text + images)"
enabled = true

[[tools]]
name = "bash"
description = "Execute bash commands"
enabled = true
timeout_seconds = 120

[[tools]]
name = "edit"
description = "Make precise text replacements with exact text matching"
enabled = true

[[tools]]
name = "write"
description = "Create or overwrite files"
enabled = true

[[tools]]
name = "skill"
description = "Propose a skill: a durable note about how to work in this repository"
enabled = true

# MCP servers — each referenced by name, never by value.
#
# NOT CONNECTED BY THIS BUILD. Declaring one is recorded and reported at
# startup, but its tools will not be available. Capability comes from what
# gnomon implements, not from what a model can do.
# [mcp_servers.example]
# name = "example-server"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@example/mcp-server"]
