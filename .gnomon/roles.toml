# Role routing — model + sampling params per role.
# Changing which model implements a role is a surface change (hashes).
#
# Model names are concrete backend tags, not symbolic aliases. Rule 1 says no
# machine-scoped configuration: an alias like "local:large" would have to be
# resolved per-machine, which is exactly the thing this harness forbids. The
# tag that reaches the backend lives here, in the surface, and is hashed.

[roles.plan]
model = "qwen3.6:35b"
temperature = 0.2
top_p = 0.9
max_steps = 20
max_steps_total = 160
tools = ["read", "glob", "grep", "compute", "todo", "task", "bash"]
# Measured, 2026-09-02: this role holds `bash` and carried no bash_deny at
# all, so the guard in tools.ts is skipped outright --
# `if (ctx.bashDeny && ctx.bashDeny.length > 0)`. Every spelling `implement`
# refuses reached the shell from here unrefused: `git push --force`,
# `git push origin +master`, `git push origin :master`,
# `git push --delete origin master`, `git branch -D`.
#
# The only thing standing between this role and a rewritten release branch was
# .gnomon/skills/git-branching.md, which is loaded into this role's prompt and
# says "Never commit straight to the default branch" / never force-push. A
# skill is advice to a model. It is not a control, and a surface must not read
# as though it is one.
#
# These are the five patterns `implement` already carried, copied verbatim so
# all the bash-holding roles refuse the same set.
bash_deny = [
  '\bgit\s+push\b[^|;&]*\s(--force|--force-with-lease|-f)\b',   # force-push, any branch
  '\bgit\s+push\b[^|;&]*\s[+:]',                               # +refspec forces, :refspec deletes
  '\bgit\s+push\b[^|;&]*[\s:+/](main|master|release)\b',        # straight onto a release branch
  '\bgit\s+push\b[^|;&]*--delete\b',                            # deleting a branch on the remote
  '\bgit\s+branch\b[^|;&]*\s(-D\b|--delete\b|-d\b[^|;&]*--force\b)',  # discarding an unmerged branch
]
description = "Hardest reasoning, lowest call volume"

[roles.plan.fallback]
model = "nemotron-3-ultra-free"
endpoint = "zen"

[roles.implement]
endpoint = "go"
model = "deepseek-v4-flash"
temperature = 0.3
top_p = 0.95
# Surveying a repository costs a dozen calls before any work starts.
max_steps = 28
max_steps_total = 224
tools = ["read", "glob", "grep", "compute", "todo", "write", "edit", "bash"]
# Operations whose damage is neither local nor undoable by re-running
# something. This role has unrestricted bash by necessity — it runs builds,
# installers and suites nobody can enumerate ahead of time — so the guardrail
# is a deny-list rather than an allow-list. Deny wins over allow.
#
# Not a substitute for branch protection on the remote: that is the control
# that binds everyone, and this one only binds the agent. It is the local half.
bash_deny = [
  # Measured against the real syntax: the previous list denied `--force` and
  # `-D` and let through `git push origin +master` (force-push by refspec),
  # `git push origin :master` (delete the remote branch), and
  # `git branch --delete --force`. Four operations named, all four reachable by
  # their ordinary spellings.
  '\bgit\s+push\b[^|;&]*\s(--force|--force-with-lease|-f)\b',   # force-push, any branch
  '\bgit\s+push\b[^|;&]*\s[+:]',                               # +refspec forces, :refspec deletes
  '\bgit\s+push\b[^|;&]*[\s:+/](main|master|release)\b',        # straight onto a release branch
  '\bgit\s+push\b[^|;&]*--delete\b',                            # deleting a branch on the remote
  '\bgit\s+branch\b[^|;&]*\s(-D\b|--delete\b|-d\b[^|;&]*--force\b)',  # discarding an unmerged branch
]

description = "Highest token volume — this is where local hosting saves money"

[roles.implement.fallback]
model = "nemotron-3-ultra-free"
endpoint = "zen"

