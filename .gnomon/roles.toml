# Role routing — model + sampling params per role.
# Changing which model implements a role is a surface change (hashes).

[roles.plan]
model = "frontier:remote"
temperature = 0.2
top_p = 0.9
description = "Hardest reasoning, lowest call volume"

[roles.implement]
model = "local:large"
temperature = 0.3
top_p = 0.95
description = "Highest token volume — this is where local hosting saves money"

[roles.critique]
model = "local:large:separate"
temperature = 0.1
top_p = 0.9
description = "Must not share context with the implementer"

[roles.smol]
model = "local:small"
temperature = 0.2
top_p = 0.95
description = "Summarisation, compaction, commit messages"
