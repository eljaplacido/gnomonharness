[roles.smol]
model = "qwen2.5:7b-instruct"
temperature = 0.2
top_p = 0.95
max_steps = 8
max_steps_total = 64
tools = ["read", "glob", "grep", "compute", "todo"]
description = "Summarisation, compaction, commit messages"

# ── specify → contract → test → implement → verify ─────────────────────────
# Separated by capability, not by instruction: the tool list is the boundary.

[roles.coordinator]
model = "qwen3.6:35b"
endpoint = "local"
temperature = 0.2
top_p = 0.9
max_steps = 20
max_steps_total = 160
tools = ["read", "glob", "grep", "compute", "todo", "task", "write", "skill"]
# No edit, so it cannot revise code in place, and write_allow so it cannot
# create it either. Not .gnomon/**: skill proposals go to
# .gnomon/skills/proposed/ through the skill tool, and accepting one is a
# human act that changes the surface hash.
write_allow = ["docs/**", "conformance/**", "*.md"]
description = "Intent and contracts — writes specs, and the only role that authors skills"

[roles.implementor]
model = "qwen3.6:35b"
endpoint = "local"
temperature = 0.3
top_p = 0.95
max_steps = 24
max_steps_total = 192
tools = ["read", "glob", "grep", "compute", "todo", "write", "edit", "bash"]
# Operations whose damage is neither local nor undoable by re-running
# something. This role has unrestricted bash by necessity — it runs builds,
# installers and suites nobody can enumerate ahead of time — so the guardrail
# is a deny-list rather than an allow-list. Deny wins over allow.
#
# Not a substitute for branch protection on the remote: that is the control
# that binds everyone, and this one only binds the agent. It is the local half.
bash_deny = [
  # Measured against the real syntax: the previous list denied `--force` and
  # `-D` and let through `git push origin +master` (force-push by refspec),
  # `git push origin :master` (delete the remote branch), and
  # `git branch --delete --force`. Four operations named, all four reachable by
  # their ordinary spellings.
  '\bgit\s+push\b[^|;&]*\s(--force|--force-with-lease|-f)\b',   # force-push, any branch
  '\bgit\s+push\b[^|;&]*\s[+:]',                               # +refspec forces, :refspec deletes
  '\bgit\s+push\b[^|;&]*[\s:+/](main|master|release)\b',        # straight onto a release branch
  '\bgit\s+push\b[^|;&]*--delete\b',                            # deleting a branch on the remote
  '\bgit\s+branch\b[^|;&]*\s(-D\b|--delete\b|-d\b[^|;&]*--force\b)',  # discarding an unmerged branch
]

description = "Tests first, then the code that satisfies them"

[roles.verifier]
model = "deepseek-r1:32b-qwen-distill-q4_K_M"
endpoint = "local"
temperature = 0.1
top_p = 0.9
max_steps = 20
max_steps_total = 160
tools = ["read", "glob", "grep", "compute", "todo", "bash"]
# `bash` can write anything, so `tools` alone cannot make this role
# read-only. This list is what actually constrains it: the suite can be run,
# nothing else. Remove it and the verifier can alter what it judges.
bash_allow = [
  '^septacore check\b',
  '^(cargo|pnpm|npm|yarn|pytest|python -m pytest|go|make)\s',
  '^(ls|cat|head|tail|grep|rg|find|git (status|diff|log|show))\s',
]
bash_deny = [
  # `find` is on the allow-list for reading the tree, but -exec/-delete/-fprintf
  # turn it into an arbitrary write. Measured: a verifier described as "Cannot
  # write" created and deleted files through all three.
  '-exec', '-execdir', '-ok', '-okdir', '-delete', '-fprint',
  '\bxargs\b',
]
description = "Runs the suite and reports. Cannot write."
