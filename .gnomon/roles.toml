# Role routing — model + sampling params per role.
# Changing which model implements a role is a surface change (hashes).
#
# Model names are concrete backend tags, not symbolic aliases. Rule 1 says no
# machine-scoped configuration: an alias like "local:large" would have to be
# resolved per-machine, which is exactly the thing this harness forbids. The
# tag that reaches the backend lives here, in the surface, and is hashed.

[roles.plan]
model = "qwen3.6:35b"
temperature = 0.2
top_p = 0.9
description = "Hardest reasoning, lowest call volume"

[roles.plan.fallback]
model = "nemotron-3-ultra-free"
endpoint = "zen"

[roles.implement]
model = "qwen3.6:35b"
temperature = 0.3
top_p = 0.95
# Surveying a repository costs a dozen calls before any work starts.
max_steps = 28
description = "Highest token volume — this is where local hosting saves money"

[roles.implement.fallback]
model = "nemotron-3-ultra-free"
endpoint = "zen"

[roles.critique]
model = "deepseek-r1:32b-qwen-distill-q4_K_M"
temperature = 0.1
top_p = 0.9
description = "Must not share context with the implementer — distinct model"

[roles.smol]
model = "qwen2.5:7b-instruct"
temperature = 0.2
top_p = 0.95
description = "Summarisation, compaction, commit messages"

# ── specify → contract → test → implement → verify ─────────────────────────
# Separated by capability, not by instruction: the tool list is the boundary.

[roles.coordinator]
model = "qwen3.6:35b"
endpoint = "local"
temperature = 0.2
top_p = 0.9
max_steps = 12
tools = ["read", "write", "skill"]
description = "Intent and contracts — writes specs, and the only role that authors skills"

[roles.implementor]
model = "qwen3.6:35b"
endpoint = "local"
temperature = 0.3
top_p = 0.95
max_steps = 24
tools = ["read", "write", "edit", "bash"]
description = "Tests first, then the code that satisfies them"

[roles.verifier]
model = "deepseek-r1:32b-qwen-distill-q4_K_M"
endpoint = "local"
temperature = 0.1
top_p = 0.9
max_steps = 12
tools = ["read", "bash"]
# `bash` can write anything, so `tools` alone cannot make this role
# read-only. This list is what actually constrains it: the suite can be run,
# nothing else. Remove it and the verifier can alter what it judges.
bash_allow = [
  '^(cargo|pnpm|npm|yarn|pytest|python -m pytest|go|make)\s',
  '^(ls|cat|head|tail|grep|rg|find|git (status|diff|log|show))\s',
]
description = "Runs the suite and reports. Cannot write."
