# gnomon desktop: its own Cargo workspace, deliberately NOT a member of the
# repository's root workspace. The root `cargo test --all` (and the README test
# count the gate holds it to) covers gnomon's Rust crates; this package needs
# WebKitGTK / WebView2 to build its Tauri half and is built and tested by its
# own workflow, .github/workflows/desktop.yml.
[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Elja Placido <digicisu@gmail.com>"]
repository = "https://github.com/eljaplacido/gnomonharness"

# Size first: this is a window over a local page, not a hot loop.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
