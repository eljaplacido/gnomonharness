# gnomon compliance catalog: which controls of which frameworks gnomon has
# evidence for, and where that evidence comes from. Read by `gnomon
# compliance` (packages/gnomon-cli/src/compliance.ts).
#
# This is a MAPPING, not an assessment. gnomon never reports a project as
# compliant: whether an obligation applies, and whether it is met, depends on
# the organisation, its role (provider, deployer, controller, processor) and its
# use case. The mapping is dated; review it with someone qualified before you
# rely on it. It is not legal advice.
#
# Each [[controls]] entry:
#   framework  a key of [frameworks]
#   id         stable, per framework
#   title      the requirement, in the framework's own terms
#   scope      "gnomon"        gnomon's settings or records are the evidence
#              "shared"        gnomon contributes evidence; the rest is the organisation's
#              "organisation"  gnomon provides no evidence; listed so nobody assumes it does
#   project    probe ids (compliance.ts PROBES): read from this project's surface and records
#   harness    [[facts]] ids: properties of gnomon itself, with where they are shown
#   note       what a reader should know

as_of = "2026-11-17"
stale_after_days = 180
disclaimer = "A mapping of gnomon evidence to framework controls, not an assessment and not legal advice. Applicability and compliance are the organisation's to determine."

[frameworks.eu-ai-act]
name = "EU AI Act — Regulation (EU) 2024/1689"
source = "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
note = "Most obligations below attach to high-risk AI systems, which a coding agent usually is not. They are listed because they describe the evidence a careful deployment of any agent can keep."

[frameworks.gdpr]
name = "GDPR — Regulation (EU) 2016/679"
source = "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
note = "Relevant where prompts, repository content or records contain personal data."

[frameworks.owasp-llm]
name = "OWASP Top 10 for LLM Applications (2025)"
source = "https://genai.owasp.org/llm-top-10/"
note = "Risks of applications built on language models; for an agent harness, mostly about what a manipulated model can make the agent do."

[frameworks.iso-42001]
name = "ISO/IEC 42001:2023 — AI management systems (Annex A controls)"
source = "https://www.iso.org/standard/81230.html"
note = "A management-system standard: certification is of the organisation's AIMS. gnomon supplies operational evidence for some Annex A controls."

[frameworks.nist-ai-rmf]
name = "NIST AI Risk Management Framework 1.0 (AI 100-1)"
source = "https://doi.org/10.6028/NIST.AI.100-1"
note = "Voluntary. Subcategories of GOVERN, MAP, MEASURE and MANAGE that gnomon's records and tests bear on."

[frameworks.iso-27001]
name = "ISO/IEC 27001:2022 — Information security (Annex A controls)"
source = "https://www.iso.org/standard/27001"
note = "Certification is of the organisation's ISMS; listed are Annex A controls the agent's own operation touches."

[frameworks.soc2]
name = "SOC 2 — AICPA Trust Services Criteria (2017, points of focus revised 2022)"
source = "https://www.aicpa-cima.com/resources/download/2017-trust-services-criteria-with-revised-points-of-focus-2022"
note = "A SOC 2 report is an auditor's opinion on the organisation's controls; gnomon evidence can support the common criteria listed."

[frameworks.cra]
name = "EU Cyber Resilience Act — Regulation (EU) 2024/2847"
source = "https://eur-lex.europa.eu/eli/reg/2024/2847/oj"
note = "Obligations of manufacturers of products with digital elements. Here the product is gnomon itself: these rows are its maintainer's evidence, not the project's."

[frameworks.dora]
name = "DORA — Digital Operational Resilience Act, Regulation (EU) 2022/2554"
source = "https://eur-lex.europa.eu/eli/reg/2022/2554/oj"
note = "Applies to EU financial entities. A model provider reached over the network is an ICT third-party service provider."

# ── Facts: properties of gnomon, the same for every project ──────────────────

[[facts]]
id = "surface_hash"
text = "Behaviour is fixed by the content-hashed .gnomon/ directory, recorded in every session and audit record"
ref = "README.md#the-six-rules"

[[facts]]
id = "contracts_published"
text = "Exit codes, record shapes and enumerations are published contracts with golden fixtures"
ref = "docs/CONTRACTS.md"

[[facts]]
id = "explain"
text = "/explain answers what a feature is and how this repository has it set, from the live surface"
ref = "README.md#interactive-commands"

[[facts]]
id = "refuses_unasked"
text = "A non-interactive run refuses a gated call rather than assuming consent"
ref = ".github/SECURITY.md#scope"

[[facts]]
id = "fault_disclosure"
text = "Endpoint and model faults are announced rather than ridden out silently: fault-disclosure 8/8; the chaos suite documents the three faults that only an endpoint probe can see"
ref = "benchmarks/fault-disclosure/README.md"

[[facts]]
id = "silent_success"
text = "No decision point reports success while the thing underneath failed: 0 of 11"
ref = "benchmarks/silent-success/README.md"

[[facts]]
id = "finish_gate"
text = "The finish gate checks a final answer for claims no tool call after the last change supports"
ref = "docs/CONTRACTS.md"

[[facts]]
id = "zero_deps"
text = "No third-party runtime dependency in any package"
ref = ".github/SECURITY.md#scope"

[[facts]]
id = "provenance"
text = "Releases are published with npm provenance and checksummed, attested archives"
ref = "docs/RELEASING.md"

[[facts]]
id = "credentials_outside_surface"
text = "The surface names a key's environment variable, never its value; keys live machine-local, mode 0600"
ref = ".github/SECURITY.md#scope"

[[facts]]
id = "no_telemetry"
text = "No telemetry and no background service; every network destination is declared and listed"
ref = "docs/PRIVACY.md"

[[facts]]
id = "dataflow_register"
text = "gnomon compliance dataflow lists every destination a role can send prompts and repository content to, with host, locality, declared region and what is sent; an opt-in residency rule refuses the rest"
ref = "README.md#data-flows-and-residency--gnomon-compliance-dataflow"

[[facts]]
id = "metadata_default"
text = "The scaffolded audit trail records metadata, not prompt or response text"
ref = "README.md#governance-and-audit"

[[facts]]
id = "tools_by_absence"
text = "A role receives only the tool schemas it is given: separation by absence, not instruction"
ref = ".github/SECURITY.md#scope"

[[facts]]
id = "guard_suite"
text = "A model-free governance suite exercises the guard against forbidden calls, tamper attempts and bypass spellings"
ref = "benchmarks/governance-model-free/README.md"

[[facts]]
id = "secure_defaults"
text = "A scaffolded surface grants nothing beyond gnomon's defaults; a surface that grants more runs clamped to them until this machine's user trusts it"
ref = "README.md#workspace-trust"

[[facts]]
id = "record_tamper"
text = "Changes to gnomon's own records that gnomon did not make are detected and listed until a person resolves them"
ref = "README.md#governance-and-audit"

[[facts]]
id = "check_foreign"
text = "gnomon check and gnomon guard judge what other harnesses do by the same committed rules"
ref = "README.md#governing-other-harnesses"

[[facts]]
id = "vuln_disclosure"
text = "A published coordinated vulnerability disclosure policy with supported versions"
ref = ".github/SECURITY.md#coordinated-vulnerability-disclosure"

[[facts]]
id = "sbom"
text = "Every release ships an SPDX SBOM, SHA256SUMS and provenance attestations"
ref = ".github/SECURITY.md#verifying-what-you-installed"

[[facts]]
id = "cra_statement"
text = "The maintainer's Cyber Resilience Act position: disclosure, contact, advisories and SBOM"
ref = ".github/SECURITY.md#eu-cyber-resilience-act"

[[facts]]
id = "benchmarks_published"
text = "Pre-registered benchmarks with raw results in the repository and a kit to reproduce them"
ref = "benchmarks/kit/README.md"

[[facts]]
id = "step_limits"
text = "Turns are bounded: step walls, stall and idle checks, deadlines, retry budgets"
ref = "README.md#long-turns"

