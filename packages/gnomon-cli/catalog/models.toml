# gnomon's model catalog: which local model `gnomon setup` recommends for a
# machine, and why.
#
# Harness data, versioned with the release like the scaffold templates. It is
# NOT part of any project's surface and is never fetched from the network.
# `gnomon setup --catalog FILE` and `gnomon doctor --catalog FILE` read another
# file in this format instead. It only decides what setup PROPOSES: what a
# project runs is the tags written into its .gnomon/, nothing else.
#
# Updated with releases only. Model names go stale within months, so every
# recommendation prints `label`, and a catalog older than `stale_after_days`
# says that newer models likely exist.
#
# Two kinds of figures, kept apart on purpose:
#   [[measured]]  gnomon's own benchmark runs, with the run named. Only the
#                 models listed there have been measured by gnomon at all.
#   [[model]]     sizes and memory thresholds. download_gb is what Ollama's
#                 library lists (qwen3.6:35b read from an installed manifest on
#                 as_of); mem_gb is an estimate with a 32k-token context.
#                 `measured = false` prints "not measured by gnomon".

as_of = "2026-11-03"
label = "2026-11"
stale_after_days = 180
source = "gnomon benchmark runs R1, R1H and BUD (benchmarks/results/*-2026-11, branch bench/peers-2026-11); sizes from ollama.com/library"

[budget]
# How much of each kind of memory a model may use, for an installed model this
# catalog does not know (sized from what the runtime reports). Catalog models
# use their own min_* thresholds below instead.
vram_fraction = 0.9       # discrete GPUs: the sum of their memory
unified_fraction = 0.75   # Apple Silicon, NVIDIA GB10: RAM shared with the GPU
cpu_fraction = 0.5        # no usable GPU: system RAM, and slow
overhead = 1.2            # weights x this = weights plus a working context
# Thresholds are nominal sizes ("a 24 GB card"); hardware reports less. An RTX
# 4090 reports 23.99 GiB, and an 8 GB laptop about 7 GiB after the firmware's
# share. A machine clears a threshold at this fraction of it.
nominal_tolerance = 0.85

[speed]
# PROVISIONAL. Set from two machines gnomon measured (RTX 5090 at ~375 tok/s
# generation and NVIDIA GB10 at ~66 tok/s, both qwen3.6-35b on llama.cpp), not
# calibrated. The R1 and R3 runs calibrate them; until then setup prints them
# as provisional. They decide only what setup SUGGESTS.
provisional = true
local_only_min_gen_tps = 40       # generation at or above: every role can stay local
local_only_min_prefill_tps = 500  # and prompt processing at or above
cloud_first_below_gen_tps = 10    # generation below: too slow for a task; cloud first

[hybrid]
# What setup cites when it suggests hybrid; kept consistent with
# docs/benchmarks/HYBRID.md. R1H's RTX 5090 lead (2026-11, gnomon d59e6c19)
# did not reproduce: R3R re-ran its lane on v0.4.0 and the hybrid fell behind
# cloud-only; R4H ran R1H's build and v0.4.1 side by side and found no build
# effect (20 vs 19, McNemar p = 1.0). Cause open. The GB10 results stand.
# evidence_unified's cloud-only half (21/32 vs 23/32) is R1, whose summary is
# not yet committed to bench/peers-2026-11; the local-only half is M2 (committed).
evidence = "On an RTX 5090, cloud plans + local builds showed no measured advantage over cloud-only: an earlier lead did not reproduce (R3R: 19/31 vs 24/31 cloud-only on v0.4.0; R4H: no build effect). See docs/benchmarks/HYBRID.md."
evidence_unified = "On an NVIDIA GB10 the same split solved 22/32 vs 16/31 local-only (M2, McNemar p = 0.07), and 21/32 vs 23/32 cloud-only (R1): no difference from cloud-only shown."
run = "R1H, R3R, R4H, R1 and M2, 2026-11 (benchmarks/results/*-2026-11 on branch bench/peers-2026-11)"

# Models, best first. A machine is offered every entry it clears; the first
# one that fits is the recommendation.

[[model]]
tag = "qwen3.6:35b"
name = "Qwen3.6-35B-A3B"
runtime = "ollama"
aliases = ["qwen3.6:35b-a3b"]
served_as = ["qwen3.6-35b"]   # how llama.cpp / LM Studio / vLLM listings name it
params_b = 35
active_b = 3                  # mixture of experts: speed follows the 3B active
quant = "Q4"
download_gb = 23.9
mem_gb = 27
min_vram_gb = 24
min_unified_gb = 64
min_cpu_ram_gb = 64
tier = "large"
tools = true
measured = true
note_vram = "On a 24 GB card a few layers may spill to the CPU; as a mixture of experts it stays usable. The speed check tells."
llamacpp = "a Q4 GGUF of Qwen3.6-35B-A3B (gnomon measured Qwen3.6-35B-A3B-UD-Q4_K_S.gguf): llama-server -m <file>.gguf --jinja -c 65536 --port 8080"

