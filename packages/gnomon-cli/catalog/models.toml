# gnomon's own measurements. One row per (model, machine). `solved`/`of` is the
# model working alone (every role local) on the run named.
#
# Read with the later runs (2026-11-07 truth pass). RTX 5090: R1H (build
# d59e6c19) is the best of three runs of that lane; R3R (v0.4.0) solved 22/29
# and LG1 (v0.4.2) 18/32, same model, same cap. GB10: R1's summary.txt is not
# yet committed to bench/peers-2026-11; M2 (committed, v0.4.0) solved 16/31 on
# the same machine and model. setup prints only `solved`/`of` and the run name.

[[measured]]
tag = "qwen3.6:35b"
machine = "RTX 5090"
memory = "vram"
memory_gb = 32
engine = "llama.cpp b11739, UD-Q4_K_S GGUF with a DFlash draft, reasoning off"
solved = 24
of = 32
gen_tps = 375
prefill_tps = 4000
run = "R1H, 2026-11 (16 Terminal-Bench tasks x 2, 900 s cap); speeds from BUD"

[[measured]]
tag = "qwen3.6:35b"
machine = "NVIDIA GB10 (DGX Spark)"
memory = "unified"
memory_gb = 128
engine = "llama.cpp, UD-Q4_K_S GGUF with a DFlash draft, reasoning off"
solved = 18
of = 32
gen_tps = 66
prefill_tps = 1070
run = "R1, 2026-11 (16 Terminal-Bench tasks x 2, 900 s cap); speeds from the server's journal"

# A cloud model per preset, offered as the default planner when one is added.

[[cloud]]
preset = "opencode-go"
model = "deepseek-v4.1-flash"
note = "the cloud model in R1H and R1"
