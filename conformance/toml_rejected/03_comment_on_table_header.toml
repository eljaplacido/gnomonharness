# An inline comment on a table header. VALID TOML 1.0 — gnomon refuses to
# start.
#
# Comments are stripped from VALUES only. A header is matched with
# /^\[(.+)\]$/ against the raw line, so anything after the closing bracket
# means the line matches nothing at all. The most plausible authoring mistake
# in this set: every other line in a surface accepts a trailing comment, so
# there is nothing to warn the author that headers do not.

[tools] # the tools this role may call
name = "read"
