# A table header missing its closing bracket.
#
# The regression the parser's throw exists for. `[roles.verifier` used to fall
# off the bottom of the loop with no else branch: the header was dropped and
# its keys were HOISTED to the top level, so the role vanished while its
# bash_allow became a root key read by nothing — a role that appears to exist
# in the file and is not there.
#
# Not valid TOML either; a spec parser rejects it too.

[roles.verifier
bash_allow = ["ls"]
