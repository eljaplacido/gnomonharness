# Environment snapshot at turn 0: cwd listing, languages, package managers, memory, in the first request.
# KNOB PENDING (feat/sweep-knobs, env_snapshot): key and table are the proposal; confirm, then set status = "ready".
[arm]
id = "ENV"
family = "env_snapshot"
level = "on"
status = "pending-knob"
branches = ["A", "B"]
requires = ["env_snapshot"]
title = "env_snapshot = true"
hypothesis = "'executable not installed or not in PATH' is 24.1% of TB command failures; a snapshot saves exploration"
evidence = "harnesses.md #5 (grade B: Meta-Harness 74.7 -> 76.4 on TB2, one discovered change)"
cost_factor = 1.0

[[edit]]
file = "config.toml"
table = "turn"
key = "env_snapshot"
value = true

[[expect]]
on = "surface"
path = "config.toml:turn.env_snapshot"
op = "equals"
value = true
