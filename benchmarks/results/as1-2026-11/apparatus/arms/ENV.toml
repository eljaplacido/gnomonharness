# Environment snapshot at turn 0: cwd listing, git status, OS/CPU/memory, toolchain versions, appended to the system
# prompt of the first request (and every later one).
# KNOB CONFIRMED (Amendment 1, 2026-11-06), CONTRACTS §32: config.toml [context] env_snapshot = true (the proposal's
# [turn] table was wrong). Recorded as a bootstrap: counters.bootstrap.id = "env_snapshot" (§19).
[arm]
id = "ENV"
family = "env_snapshot"
level = "on"
status = "ready"
branches = ["A", "B", "C"]
requires = ["env_snapshot"]
title = "[context] env_snapshot = true"
hypothesis = "'executable not installed or not in PATH' is 24.1% of TB command failures; a snapshot saves exploration"
evidence = "harnesses.md #5 (grade B: Meta-Harness 74.7 -> 76.4 on TB2, one discovered change)"
cost_factor = 1.0

# The snapshot is a workspace-trust grant (CONTRACTS §32/§8): on an untrusted surface gnomon runs clamped and takes no
# snapshot (the wire test's first run proved it: trust.decision = "clamped", no counters.bootstrap). `--trust` trusts
# this cell's surface; it grants nothing else here (the env_snapshot bootstrap was the only grant listed).
[run]
task_args = ["--trust"]

[[edit]]
file = "config.toml"
table = "context"
key = "env_snapshot"
value = true

[[expect]]
on = "surface"
path = "config.toml:context.env_snapshot"
op = "equals"
value = true

[[expect]]   # the snapshot was attempted (a record exists only for an uncapped run; capped = unverifiable)
on = "record"
path = "counters.bootstrap.id"
op = "equals"
value = "env_snapshot"

[[expect]]   # it ran to the end inside its 2,000 ms / 6,000-byte bound (a slow container may cut it): warning only
on = "record"
path = "counters.bootstrap.outcome"
op = "equals"
value = "ok"
severity = "warn"
