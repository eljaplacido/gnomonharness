# Reasoning effort = max on the implementor (the role `gnomon task --role implementor` runs).
# KNOB PENDING (feat/sweep-knobs): the key name and table below are the proposal (models-recipes.md §6.2: a
# validated per-provider enum in roles.toml). Confirm against the knob PR's CONTRACTS, then set status = "ready".
# Go's listing for deepseek-v4.1-flash: reasoning.effort = ["low", "high", "max"]; DeepSeek's documented default
# is high, so E-high is expected to sit close to the control (the A/A arm, not this one, is the null calibration).
[arm]
id = "EM"
family = "reasoning_effort"
level = "max"
status = "pending-knob"
branches = ["A", "B"]
requires = ["reasoning_effort"]
title = "reasoning_effort = \"max\" (implementor)"
hypothesis = "effort trades per-call thinking time against calls under a fixed 1,800 s cap"
evidence = "models-recipes.md §3 and §6.2 (grade B: TB4 effort ladders; LangChain xhigh 53.9 vs high 63.6 vs sandwich 66.5)"
cost_factor = 1.5

[[edit]]
file = "roles.toml"
table = "roles.implementor"
key = "reasoning_effort"
value = "max"

[[expect]]
on = "wire"
path = "reasoning_effort"
op = "equals"
value = "max"
quantifier = "any"
