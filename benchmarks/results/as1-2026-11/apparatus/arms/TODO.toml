# Todo gate: an answer is not accepted while the turn's todo list has open items.
# KNOB PENDING (feat/sweep-knobs, todo_gate): key and table are the proposal; confirm, then set status = "ready".
[arm]
id = "TODO"
family = "todo_gate"
level = "on"
status = "pending-knob"
branches = ["A", "B"]
requires = ["todo_gate"]
