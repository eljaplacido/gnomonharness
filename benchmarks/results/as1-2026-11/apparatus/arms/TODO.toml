# Todo gate: an answer is not accepted while the turn's todo list has open items (handed back once).
# KNOB CONFIRMED (Amendment 1, 2026-11-06), CONTRACTS §32: config.toml [turn] todo_gate = true (the proposal's
# policy.toml [verify] was wrong). counters.todo_gate is present only when declared.
[arm]
id = "TODO"
family = "todo_gate"
level = "on"
status = "ready"
branches = ["A", "B", "C"]
requires = ["todo_gate"]
title = "[turn] todo_gate = true"
hypothesis = "optional todos get dropped under pressure; enforcing them prevents premature completion"
evidence = "harnesses.md #6 (grade C: ForgeCode 38 -> 66 on TB2, confounded; OPENDEV design rationale)"
cost_factor = 1.05

[[edit]]
file = "config.toml"
table = "turn"
key = "todo_gate"
value = true

[[expect]]
on = "surface"
path = "config.toml:turn.todo_gate"
op = "equals"
value = true

[[expect]]
on = "record"
path = "counters.todo_gate.max_rounds"
op = "equals"
value = 1
