# Edit tool, compat variant: opencode/Claude-Code-like argument names and tiered fuzzy matching.
# EXCLUDED (Amendment 1, 2026-11-06). The knob exists (CONTRACTS §32: tools.toml `[[tools]] name = "edit"`,
# variant = "compat"), but it lives in an array-of-tables entry of tools.toml, which AS1's line-level surface patch
# cannot target by construction (FILES = config/roles/policy; array tables are never targets). Extending the patcher
# before launch would add untested apparatus; the arm is graded C and is dropped from this run, not silently.
[arm]
id = "EDIT"
family = "edit_variant"
level = "compat"
status = "excluded"
branches = ["A", "B", "C"]
requires = ["edit_variant"]
title = "edit_variant = \"compat\""
hypothesis = "tool names and shapes close to training priors lower tool-call error rates"
evidence = "harnesses.md #8 (grade C: AHE tools component +3.3 pp; ForgeCode schema hygiene, no numbers)"
cost_factor = 1.0

[[edit]]
file = "config.toml"
table = "defaults"
key = "edit_variant"
value = "compat"

[[expect]]
on = "surface"
path = "config.toml:defaults.edit_variant"
op = "equals"
value = "compat"
