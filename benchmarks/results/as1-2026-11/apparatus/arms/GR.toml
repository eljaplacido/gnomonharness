# Completion gate, review mode (PR #152, CONTRACTS §30): the checklist, then a fresh read-only `verifier` sub-turn
# that gets the task text and the workspace (never the transcript) and tries to break the solution.
[arm]
id = "GR"
family = "completion_gate"
level = "review"
status = "ready"
branches = ["A", "B"]
requires = ["completion_gate"]
title = "[verify] completion_gate = \"review\""
hypothesis = "an independent auditor of environment state catches what the checklist misses"
evidence = "harnesses.md #3 (grade B: LongHorizon-Harness +7.5 on TB 2.1, auditor 38% of tokens)"
cost_factor = 1.4

[[edit]]
file = "policy.toml"
table = "verify"
key = "completion_gate"
value = "review"

[[expect]]
on = "record"
path = "counters.completion_gate.mode"
op = "equals"
value = "review"
