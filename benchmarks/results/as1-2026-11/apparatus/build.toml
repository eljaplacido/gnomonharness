# The one build every AS1 arm runs (benchmark arms use the current build). FILLED IN BEFORE LAUNCH, then committed:
# run_as1.py refuses to run while status = "pending" or any value still holds a {{placeholder}}.
#
# Branch: "A" if H3 adopts replay_reasoning as a default (its pre-registered rule) and the build ships PR #153's
#         default changes; "B" otherwise. The branch picks the control (arms/CTL.A.toml or arms/CTL.B.toml).
# Build:  v0.4.3 as released, or a pinned master build (tarballs from `npm pack`, served from apparatus/build/<v>/
#         on the docker bridge, source = "mirror"). Either way pinned three ways, as H3's adapter pins v0.4.2:
#         SHA256SUMS hashes to sums_sha256; each of the four tarballs matches SHA256SUMS; gnomon-core's package.json
#         gnomonBuild = build_stamp and `gnomon --version` = gnomon/<version>+<build_stamp>.
# Knobs:  the knob names the build provides. An arm runs only if its `requires` are all listed here AND its fragment
#         status is "ready" (the pre-launch wire test, wiretest_as1.py, proves each one on this build).
# Amendment 1 (2026-11-06): branch "C" = v0.4.4's own scaffold + _PATCH + replay declared (arms/CTL.C.toml);
# neither A (assumed the nudge off) nor B (the 1M recipe window and nudge off in the control) matches v0.4.4.
# source = "mirror": the v0.4.4 GitHub release is still a DRAFT (its assets are not public), so the four tarballs and
# SHA256SUMS were downloaded with `gh release download v0.4.4` into apparatus/build/v0.4.4/ and are served from
# 172.17.0.1:4739 by run_as1.py; the hash pins below make the source irrelevant.
[build]
status = "ready"
branch = "C"
version = "0.4.4"
commit = "6b7f821098dfcbd104c869f3da885f0ef15e1261"
build_stamp = "v0.4.4-6b7f821"
sums_sha256 = "eae55819fa21063eae584d9811db1dcf6b6d1ee34f9819987bc565adf67bec98"
source = "mirror"
budget_profile = "lean"                 # 25 / 10 / 40, confirmatory k = 2 (PRE-REGISTRATION §8; the user's choice)
release_published = "draft: release created 2026-11-06T13:00:32Z, not yet published; tag v0.4.4 = 6b7f821 on master"
knobs = ["replay_default", "deadline", "completion_gate", "reasoning_effort", "sampling_passthrough", "env_snapshot",
         "todo_gate", "edit_variant", "package_index_allowlist", "steer_role"]
                                        # NOT "nudge_default_off": v0.4.4 keeps nudge_after_idle = 12 (CONTRACTS §31)
wiretest = "8cff0862bf67c669997d74774371402cd0866877d8df9c6373e9a2955ac72f14"  # sha256 of ../wiretest-as1.txt (PASS on v0.4.4, branch C, 13 arms; Amendment 1)
