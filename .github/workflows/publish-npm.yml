# Publish to npm — when a human publishes a GitHub release.
#
# release.yml builds on a tag push and stops at a DRAFT on purpose: the tag
# builds and uploads, a person reads the draft and presses Publish. This
# workflow is what happens after that press, and only after it. It does not
# build, pack or choose anything. It downloads the release's own four npm
# tarballs and SHA256SUMS, checks every tarball against that file (the same
# digests scripts/install.sh checks), and publishes exactly those bytes:
# libraries first, gnomon-harness last. scripts/publish-npm.sh holds the logic
# so it can be run locally with --dry-run, and docs/RELEASING.md explains it.
#
# Safety properties, in the same spirit as release.yml's:
#
#   1. `on: release: published` and nothing else. Not `created` (a draft is
#      created first and must not publish anything), no `workflow_dispatch`, no
#      push. A failed run is retried with "Re-run jobs", which is safe because:
#   2. Idempotent. A version already on the registry is skipped, so a re-run
#      after a partial publish finishes the rest and changes nothing else.
#   3. Authentication is npm TRUSTED PUBLISHING (OIDC) when npmjs.com trusts
#      this workflow file for all four packages, and the repository secret
#      NPM_TOKEN only as a fallback until it does. scripts/npm-publish-auth.sh
#      decides before anything is downloaded, and with neither available it
#      fails saying exactly what to configure: the four package names and this
#      file's name. In OIDC mode the publish step is not given NPM_TOKEN at all,
#      so a green run proves the secret can be deleted. Measured: v0.3.3 and
#      v0.4.0 both stopped at the old "Require NPM_TOKEN" step, so the registry
#      is still at 0.3.2 (docs/RELEASING.md → "Publishing to npm").
#   4. --provenance: npm records which workflow run, commit and repository
#      published each version, which is why this job, and only this job, holds
#      `id-token: write`. The same permission is what trusted publishing
#      exchanges for a short-lived, single-package publish token. This
#      provenance names THIS workflow, which downloads rather than builds; the
#      provenance of the bytes is the SLSA attestation build-release.yml made,
#      checked by scripts/verify-release.sh.
#
# A prerelease (`v0.4.0-rc.1`, or a release marked pre-release) publishes under
# the `next` dist-tag, so `npm i -g gnomon-harness` keeps resolving the latest
# stable release.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }} to npm
    # Release tags only, as in release.yml: a `baseline-…` benchmark marker
    # published as a release must not reach the registry.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # The tag's tree, for scripts/npm-publish-auth.sh and
      # scripts/publish-npm.sh. The tarballs are NOT built from it; they come
      # from the release below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # Node 24, not 22: trusted publishing needs npm >= 11.5.1, and Node 22
      # bundles npm 10.9 (10.9.9 as of 22.23.4). Node 24 bundles 11.x. Nothing
      # here builds, so the Node version touches no published byte; it runs
      # npm and the manifest check in scripts/publish-npm.sh.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Writes an .npmrc that reads NODE_AUTH_TOKEN; the token, when there
          # is one, is only ever in the environment of the publish step.
          registry-url: https://registry.npmjs.org

      # Before anything is downloaded, as the old "Require NPM_TOKEN" step was.
      # This step never sees the token: only whether the secret is set.
      - name: Choose npm authentication (trusted publishing, else NPM_TOKEN)
        id: auth
        env:
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: bash scripts/npm-publish-auth.sh

      - name: Download the release's npm tarballs and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.tgz' --pattern 'SHA256SUMS'
          ls -l dist

      - name: Verify and publish (${{ steps.auth.outputs.mode }})
        env:
          # Empty in OIDC mode, on purpose: npm then has nothing to publish
          # with but the OIDC exchange, so a green run in that mode is proof
          # the token is unneeded. Checked locally with npm 10.9.7: an empty
          # value still lets publish-npm.sh's `npm view` read the registry
          # (0.3.2 found, 9.9.9 an E404), so the idempotency check is intact.
          NODE_AUTH_TOKEN: ${{ steps.auth.outputs.mode == 'token' && secrets.NPM_TOKEN || '' }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tag_flag=()
          if [ "$PRERELEASE" = "true" ] || [[ "$version" == *-* ]]; then
            tag_flag=(--tag next)
          fi
          bash scripts/publish-npm.sh dist "$version" --provenance "${tag_flag[@]}"
