name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

# Read-only, every job. Nothing here writes to the repository: artifacts and the
# pnpm cache go through the runner's own service token, not GITHUB_TOKEN. Until
# this line the jobs got the repository's default token permissions, which are
# a setting on GitHub rather than anything this file could show.
#
# Every `uses:` below is pinned to a full commit SHA with its version in a
# comment, not to a tag a third party can move. Dependabot (github-actions,
# weekly) proposes new SHAs with the comment updated. dtolnay/rust-toolchain
# has no release tags, so it is pinned to a commit of its `stable` branch with
# `toolchain: stable` spelled out; cargo still uses rust-toolchain.toml's pin.
permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust tests (gnomon-edit / gnomon-exec / gnomon-enums / gnomon-surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: clippy

      - name: Build & test
        run: cargo test --all

      - name: Cargo clippy
        run: cargo clippy --all -- -D warnings

  # WINDOWS. Required, as of the commit that made it pass.
  #
  # It arrived `continue-on-error: true` on 2026-09-05 with 17 failures, because
  # a job that fails on arrival teaches people to ignore the red tick. It came
  # off in the change that made it green, which is the only honest moment for
  # it: 899 passed and 3 skipped, and the three skips are POSIX behaviours that
  # cannot exist on Windows (the executable bit, and two 0600 file modes) rather
  # than things that do not work.
  windows-tests:
    name: TypeScript tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - name: Build native binaries
        run: cargo build --workspace --bins

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build (type-check)
        run: pnpm run build

      # THE FIRST-RUN JOURNEY, as a new user meets it on this OS: `gnomon
      # doctor --json` (exit 0 or 1, a gnomon.doctor/1 document), `gnomon
      # setup --json` (stops at the proposal: exit 4, writes nothing) and
      # `gnomon dashboard --no-open` on a free port (prints the sign-in link,
      # serves the page, is stopped). In an empty directory, with no model:
      # nothing is downloaded or spent. Node, so one file runs on every OS.
      - name: First-run smoke (doctor, setup, dashboard)
        timeout-minutes: 5
        run: node scripts/first_run_smoke.mjs

      - name: Run tests
        # `pnpm -r run test`, not an enumerated filter list.
        #
        # This was `--filter gnomon-core --filter gnomon-natives --filter
        # gnomon-cli --filter gnomon-tui`. Renaming the CLI package to
        # gnomon-harness for npm made `--filter gnomon-cli` match NOTHING, and
        # pnpm does not fail when only some filters match — so this step kept
        # exiting 0 while running three packages of four. On ubuntu the
        # ci-script job still ran all of them, but on windows-latest and
        # macos-latest nothing else did, so the 106 CLI tests silently stopped
        # running on the two platforms whose path and shell handling those tests
        # exist to cover.
        #
        # A list of names that must be kept in step with package.json is a list
        # that will go stale. `-r` cannot.
        run: pnpm -r run test

      # The Rust crates compute the surface hash the TS side must agree with,
      # and they were tested on ubuntu only. Path and line-ending handling is
      # exactly what differs here.
      - name: Rust tests
        run: cargo test --workspace

      # A checkout under a path with a space, launched the way `gnomon` on PATH
      # launches it. Until 2026-09-29 the launcher ran tsx.cmd with shell:true,
      # cmd.exe split the path at the space, and gnomon did not start.
      # The five model-free property suites at their published figures, on
      # Windows too (WINP, 2026-11-02: they ran only on Linux, through ci.sh,
      # and as written could not start on Windows at all).
      - name: Property suites at their published figures
        timeout-minutes: 15
        run: node scripts/property_suites.mjs

      - name: The launcher starts from a path with a space
        shell: pwsh
        run: |
          $j = Join-Path $env:RUNNER_TEMP "gnomon checkout"
          New-Item -ItemType Junction -Path $j -Target $PWD | Out-Null
          # --preserve-symlinks-main: otherwise node resolves the junction and
          # the launcher sees the real, space-free path, proving nothing.
          node --preserve-symlinks-main (Join-Path $j "packages\gnomon-cli\gnomon.js") --version
          if ($LASTEXITCODE -ne 0) { throw "launcher failed from a spaced path" }

      # THE DOCUMENTED INSTALL PATH, which nothing here ran until now.
      #
      # `pnpm run setup` is the one install command GETTING_STARTED gives
      # native-Windows users, and until 2026-09-07 it was POSIX shell:
      # `command -v`, `>/dev/null 2>&1`, `{ …; }`, `printf`, `exec $SHELL`.
      # pnpm runs scripts through cmd.exe on Windows unless `script-shell` is
      # set, and no .npmrc here sets one -- so the documented command could not
      # execute at all. Every step above passed while that was true, because
      # every step above runs cargo/pnpm/vitest directly and never the script a
      # newcomer is told to run.
      #
      # `build:native` and `link:global` are Node now. This runs them.
      # link:global's exit code is NOT asserted: it exits 1 by design when
      # PNPM_HOME is unset, which is a property of the runner's environment
      # rather than of the script. What is asserted is that both EXECUTE -- the
      # thing that was impossible before.
      - name: The documented install scripts run on Windows
        shell: pwsh
        run: |
          node scripts/build-native.mjs
          if ($LASTEXITCODE -ne 0) { throw "build:native failed on Windows" }
          node scripts/link-global.mjs
          Write-Host "link:global exited $LASTEXITCODE (0 = on PATH, 1 = PNPM_HOME unset; both are real outcomes)"

  # macOS ran no tests at all until 2026-09-05 -- the only macOS job built
  # gnomon-surface, so README's "green on macOS" honestly meant "it compiles
  # there". A platform the project claims to support and does not test is a
  # platform it supports in the README only.
  macos-tests:
    name: TypeScript tests (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - name: Build native binaries
        run: cargo build --workspace --bins

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build (type-check)
        run: pnpm run build

      # THE FIRST-RUN JOURNEY, as a new user meets it on this OS: `gnomon
      # doctor --json` (exit 0 or 1, a gnomon.doctor/1 document), `gnomon
      # setup --json` (stops at the proposal: exit 4, writes nothing) and
      # `gnomon dashboard --no-open` on a free port (prints the sign-in link,
      # serves the page, is stopped). In an empty directory, with no model:
      # nothing is downloaded or spent. Node, so one file runs on every OS.
      - name: First-run smoke (doctor, setup, dashboard)
        timeout-minutes: 5
        run: node scripts/first_run_smoke.mjs

      - name: Run tests
        # `pnpm -r run test`, not an enumerated filter list.
        #
        # This was `--filter gnomon-core --filter gnomon-natives --filter
        # gnomon-cli --filter gnomon-tui`. Renaming the CLI package to
        # gnomon-harness for npm made `--filter gnomon-cli` match NOTHING, and
        # pnpm does not fail when only some filters match — so this step kept
        # exiting 0 while running three packages of four. On ubuntu the
        # ci-script job still ran all of them, but on windows-latest and
        # macos-latest nothing else did, so the 106 CLI tests silently stopped
        # running on the two platforms whose path and shell handling those tests
        # exist to cover.
        #
        # A list of names that must be kept in step with package.json is a list
        # that will go stale. `-r` cannot.
        run: pnpm -r run test

  ts-tests:
    # Node 22 is the floor every package.json `engines` declares and the one
    # scripts/install.sh enforces; Node 24 is the current LTS, what a new user
    # installs today and what publish-npm.yml runs. Both are tested here. The
    # Node 22 leg keeps this job's original name, so a required status check
    # that names it keeps matching; the Node 24 leg gets its own.
    name: TypeScript tests (core / natives / cli / tui)${{ matrix.node != 22 && format(' on Node {0}', matrix.node) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gnomon-natives shells out to the Rust binaries, so they must exist
      # before its tests run. findBinary() looks in <repo>/target/debug.
      # --bins, not a list: this step named two of the four while the comment
      # said "the Rust binaries", so the patch-engine tests spawned a
      # gnomon-edit that was not there.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - name: Build native binaries
        run: cargo build --workspace --bins

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build (type-check)
        run: pnpm run build

      - name: Run tests
        # `pnpm -r run test`, not an enumerated filter list.
        #
        # This was `--filter gnomon-core --filter gnomon-natives --filter
        # gnomon-cli --filter gnomon-tui`. Renaming the CLI package to
        # gnomon-harness for npm made `--filter gnomon-cli` match NOTHING, and
        # pnpm does not fail when only some filters match — so this step kept
        # exiting 0 while running three packages of four. On ubuntu the
        # ci-script job still ran all of them, but on windows-latest and
        # macos-latest nothing else did, so the 106 CLI tests silently stopped
        # running on the two platforms whose path and shell handling those tests
        # exist to cover.
        #
        # A list of names that must be kept in step with package.json is a list
        # that will go stale. `-r` cannot.
        run: pnpm -r run test

  ci-script:
    name: Full CI pipeline (.gnomon/ci.sh)
    runs-on: ubuntu-latest
    needs: [rust-tests, ts-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run full CI
        run: bash .gnomon/ci.sh

  build-ubuntu:
    name: Build gnomon-surface (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [rust-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - name: Build (debug)
        run: cargo build --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Build (release)
        run: cargo build --release --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnomon-surface-ubuntu
          path: target/release/gnomon-surface

  build-macos:
    name: Build gnomon-surface (macos-latest / aarch64)
    runs-on: macos-latest
    needs: [rust-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - name: Build (debug)
        run: cargo build --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Build (release)
        run: cargo build --release --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnomon-surface-macos
          path: target/release/gnomon-surface

  test-interactive:
    name: Interactive prompt loop smoke test
    runs-on: ubuntu-latest
    needs: [rust-tests, ts-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - name: Build gnomon-surface
        run: cargo build --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # MEASURED, 2026-09-02. This step used to be:
      #
      #     … run 2>&1 | grep -E "(Commands|Available roles|exit)" && echo "PASS"
      #
      # `exit` matches "Type /quit or Ctrl+C to exit." — line 11 of the startup
      # banner, printed 27 lines before the first slash command is read. The
      # alternation was therefore satisfied by a process that had done nothing
      # but print its banner. Verified by running the loop with EMPTY stdin: no
      # command was issued, and the old pattern still matched and printed PASS.
      # `grep` being last in the pipeline threw away the CLI's exit status on
      # top of that, so a loop that crashed after the banner also passed.
      #
      # So: tee to a log, check the loop's own status, and require evidence
      # that each command actually ran. `^Commands` is the /help table and
      # `^Available roles` is the /roles table — both anchored, both printed
      # only after input is read. `^Session complete` is weaker on purpose and
      # is here for what it does prove: the loop reached its normal end instead
      # of being killed. It is present on EOF too, so it is never the only
      # evidence.
      - name: Smoke test prompt loop
        run: |
          set -uo pipefail
          set +e
          printf '/help\n/roles\n/quit\n' \
            | GNOMON_BIN_OVERRIDE=target/debug \
              pnpm -w exec tsx packages/gnomon-cli/src/index.ts run > loop.log 2>&1
          status=${PIPESTATUS[1]}
          set -e

          # CI forces colour. An un-stripped line can start with an escape
          # sequence, which would defeat every anchored pattern below and turn
          # this back into a check that cannot fail.
          sed -E $'s/\x1b\\[[0-9;]*[A-Za-z]//g' loop.log > loop.txt
          echo "----- prompt loop output -----"
          cat loop.txt
          echo "------------------------------"

          rc=0
          if [ "$status" -ne 0 ]; then
            echo "FAIL: the prompt loop exited $status"
            rc=1
          fi
          for evidence in '^Commands' '^Available roles' '^Session complete'; do
            if grep -qE "$evidence" loop.txt; then
              echo "ok: found /$evidence/"
            else
              echo "FAIL: nothing matched /$evidence/ — the loop did not get as far"
              echo "      as running the command that prints it."
              rc=1
            fi
          done
          exit $rc

  contract-fixtures:
    # THE META-CHECK. docs/CONTRACTS.md and CONTRIBUTING.md both told readers a
    # contract change arriving without a conformance/ fixture was caught.
    # Measured 2026-09-02: no job in this file looked at a diff at all, so
    # nothing was caught — CONTRACTS.md line 8 admitted as much in its own words
    # while CONTRIBUTING.md line 65 claimed the opposite. This job is what makes
    # the claim true, for the file set named in the script and no wider.
    #
    # pull_request only: the gate needs two refs to diff and a push build has no
    # dependable base (a force-push or a first commit has none at all). Stated
    # rather than papered over — a `push` build is NOT covered by this.
    name: Contract change ⇒ fixture change
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # fetch-depth: 0 — the gate needs a merge base, and the default shallow
      # clone has none. With depth 1 the gate exits 2 (cannot determine a base)
      # and the step below fails it, which is the intended behaviour: no base
      # means no answer, and no answer must not read as a pass.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Contract/fixture gate
        run: |
          set -uo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          set +e
          bash conformance/contract_fixture_gate.sh "$BASE"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo ""
            echo "FAIL: the gate could not determine a base to diff against, in CI,"
            echo "      where there is always one. That is a broken check, and a"
            echo "      broken check must not report success."
            exit 1
          fi
          exit $rc

  fresh-machine:
    # THE ONLY JOB THAT SEES WHAT A NEW USER SEES.
    #
    # Every other job runs inside a checkout, where the crates are built, the
    # workspace resolves gnomon-core to ./src/index.ts, and a git history
    # exists. An outside sweep of the released v0.2.3 on 2026-09-08 asked the
    # other question — does this work for someone who has only Node? — and
    # returned five confirmed defects, NOT ONE of which was findable from here:
    # a README install command that 404s, and a "native binary not found"
    # message that named three commands while five needed one, so
    # `gnomon enumerations` printed a sentence promising `gnomon enumerations`
    # did not need a binary.
    #
    # It installs the four tarballs the documented way into a container with
    # Node and nothing else, runs every offline command, and requires the
    # MEASURED set of commands needing a native binary to equal
    # NATIVE_ONLY_COMMANDS exactly — not "at least", so a stale constant fails
    # as loudly as a new dependency does.
    #
    # Not yet in branch protection's required set: it is new, and a check is
    # promoted to required once it has been green long enough to be trusted,
    # the same way windows-tests was.
    name: Fresh machine (Node only, no Rust, no clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` here, and @v6 not @v4 -- matching every other job in this
      # file. package.json declares `packageManager: pnpm@9.0.0`, and
      # action-setup refuses when a version is given in both places:
      # "Multiple versions of pnpm specified". Written from an older pattern
      # rather than from the file it was being added to, and it failed on the
      # first run.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The tarballs must contain compiled JS, and the declared-set side of the
      # comparison is read out of gnomon-natives' build.
      - name: Build (compile to dist/)
        run: pnpm -r run build

      - name: Fresh-machine install and command sweep
        run: |
          set -uo pipefail
          set +e
          bash scripts/fresh-machine.sh
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo ""
            echo "FAIL: no docker on a runner that has docker. The one check that"
            echo "      sees install-time defects skipped itself, and a skip must"
            echo "      not read as a pass."
            exit 1
          fi
          exit $rc
