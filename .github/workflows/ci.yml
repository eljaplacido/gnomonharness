name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust tests (gnomon-edit / gnomon-exec / gnomon-enums / gnomon-surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dtolnay/rust-toolchain — the ref names the toolchain. `dtolnay/rust-action`
      # does not exist, and every run of this workflow failed on it before the fix.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build & test
        run: cargo test --all

      - name: Cargo clippy
        run: cargo clippy --all -- -D warnings

  ts-tests:
    name: TypeScript tests (core / natives / cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gnomon-natives shells out to the Rust binaries, so they must exist
      # before its tests run. findBinary() looks in <repo>/target/debug.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native binaries
        run: cargo build --bin gnomon-surface --bin gnomon-enums

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build (type-check)
        run: pnpm run build

      - name: Run tests
        run: pnpm test --filter gnomon-core --filter gnomon-natives --filter gnomon-cli --filter gnomon-tui

  ci-script:
    name: Full CI pipeline (.gnomon/ci.sh)
    runs-on: ubuntu-latest
    needs: [rust-tests, ts-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run full CI
        run: bash .gnomon/ci.sh

  build-ubuntu:
    name: Build gnomon-surface (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [rust-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (debug)
        run: cargo build --bin gnomon-surface
        working-directory: crates/gnomon-surface

      # Built from the workspace root: a member crate still writes into the
      # workspace target/, which is where the upload step reads from.
      - name: Build (release)
        run: cargo build --release -p gnomon-surface

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gnomon-surface-ubuntu
          path: target/release/gnomon-surface

  build-macos:
    name: Build gnomon-surface (macos-latest / aarch64)
    runs-on: macos-latest
    needs: [rust-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (debug)
        run: cargo build --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Build (release)
        run: cargo build --release -p gnomon-surface

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gnomon-surface-macos
          path: target/release/gnomon-surface

  executor-contract:
    name: Executor contract (one-shot, provider unreachable)
    runs-on: ubuntu-latest
    needs: [rust-tests, ts-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build gnomon-surface
        run: cargo build -p gnomon-surface

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The one-shot mode is the invocation a machine consumer pins, so CI asserts
      # its contract rather than smoke-testing the interactive loop: with no model
      # reachable it must exit 12 (provider_unreachable) and still write a session
      # record whose only outcome is apparatus_failure. An agent that cannot reach a
      # provider has not failed the task — that distinction is the whole exit table.
      #
      # `--role smol` deliberately: it is the one role declaring no fallback, so the
      # probe stays inside the runner instead of calling a third-party endpoint.
      - name: One-shot exits on the published table
        env:
          GNOMON_BIN_OVERRIDE: target/debug
          GNOMON_MODEL_URL: http://127.0.0.1:1/v1/chat/completions
        run: |
          set +e
          pnpm -w exec tsx packages/gnomon-cli/src/index.ts -p 'ci contract probe' \
            --role smol --json > session.json
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 12 || { echo "expected 12 (provider_unreachable), got $code"; exit 1; }
          node -e '
            const r = JSON.parse(require("fs").readFileSync("session.json", "utf8"));
            const buckets = [...new Set(r.session.steps.map(s => s.bucket))];
            if (JSON.stringify(buckets) !== JSON.stringify(["apparatus_failure"]))
              throw new Error("expected only apparatus_failure, got " + buckets);
            if (!r.session.manifest.surface_hash) throw new Error("no surface hash on the record");
            const ts = r.tool_surface;
            // The invariant, not a fixed value: what was offered must be a subset of
            // what the surface declares, and `enforced` must follow what was offered.
            // Asserting `enforced === false` outlived the day the tool loop landed.
            if (!ts.effective.every(t => ts.declared.includes(t)))
              throw new Error("offered a tool the surface never declared: " + ts.effective);
            if (ts.enforced !== (ts.effective.length > 0))
              throw new Error("tool_surface.enforced does not follow what was offered");
            if (!r.environment.some(e => e.name === "GNOMON_MODEL_URL" && e.set))
              throw new Error("the environment override in force was not recorded");
            console.log("session record conforms");
          '

  test-interactive:
    name: Interactive prompt loop smoke test
    runs-on: ubuntu-latest
    needs: [rust-tests, ts-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build gnomon-surface
        run: cargo build --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Smoke test prompt loop
        run: |
          echo -e "/help\n/roles\n/quit" | \
          GNOMON_BIN_OVERRIDE=target/debug \
          pnpm -w exec tsx packages/gnomon-cli/src/index.ts run 2>&1 | \
          grep -E "(Commands|Available roles|exit)" && echo "PASS"
