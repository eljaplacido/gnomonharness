name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  PNPM_HOME: /home/runner/.pnpm/bin

jobs:
  rust-tests:
    name: Rust tests (gnomon-edit / gnomon-exec / gnomon-enums / gnomon-surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build & test
        run: cargo test --all

      - name: Cargo clippy
        run: cargo clippy --all -- -D warnings

  ts-tests:
    name: TypeScript tests (core / natives / cli / tui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gnomon-natives shells out to the Rust binaries, so they must exist
      # before its tests run. findBinary() looks in <repo>/target/debug.
      # --bins, not a list: this step named two of the four while the comment
      # said "the Rust binaries", so the patch-engine tests spawned a
      # gnomon-edit that was not there.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native binaries
        run: cargo build --workspace --bins

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build (type-check)
        run: pnpm run build

      - name: Run tests
        run: pnpm test --filter gnomon-core --filter gnomon-natives --filter gnomon-cli --filter gnomon-tui

  ci-script:
    name: Full CI pipeline (.gnomon/ci.sh)
    runs-on: ubuntu-latest
    needs: [rust-tests, ts-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run full CI
        run: bash .gnomon/ci.sh

  build-ubuntu:
    name: Build gnomon-surface (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [rust-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (debug)
        run: cargo build --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Build (release)
        run: cargo build --release --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gnomon-surface-ubuntu
          path: target/release/gnomon-surface

  build-macos:
    name: Build gnomon-surface (macos-latest / aarch64)
    runs-on: macos-latest
    needs: [rust-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (debug)
        run: cargo build --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Build (release)
        run: cargo build --release --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gnomon-surface-macos
          path: target/release/gnomon-surface

  test-interactive:
    name: Interactive prompt loop smoke test
    runs-on: ubuntu-latest
    needs: [rust-tests, ts-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build gnomon-surface
        run: cargo build --bin gnomon-surface
        working-directory: crates/gnomon-surface

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Smoke test prompt loop
        run: |
          echo -e "/help\n/roles\n/quit" | \
          GNOMON_BIN_OVERRIDE=target/debug \
          pnpm -w exec tsx packages/gnomon-cli/src/index.ts run 2>&1 | \
          grep -E "(Commands|Available roles|exit)" && echo "PASS"
