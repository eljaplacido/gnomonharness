name: Desktop app

# Builds gnomon desktop (packages/gnomon-desktop), a Tauri window over
# `gnomon dashboard`, for Windows, macOS and Linux, and uploads the installers
# as artifacts of this run. Nothing here tags, publishes, signs or releases:
# the artifacts expire with the run. Separate from ci.yml so the desktop
# package can never slow down or break the CLI's own pipeline.
on:
  pull_request:
    paths:
      - "packages/gnomon-desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# Every `uses:` is pinned to a full commit SHA with its version in a comment,
# the same pins as ci.yml (see the note there).
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Tauri CLI that bundles the app, pinned. It matches the `tauri` crate
  # in packages/gnomon-desktop/Cargo.lock (2.12.x).
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  # The app's logic (gnomon-desktop-core) needs no webview: its tests run on
  # all three OSes, against stand-ins for gnomon that print what
  # `gnomon dashboard` prints and fail the way its exit codes say.
  core:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/gnomon-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml at the repository root pins the version.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - name: Test
        run: cargo test -p gnomon-desktop-core --locked

      - name: Clippy
        run: cargo clippy -p gnomon-desktop-core --all-targets --locked -- -D warnings

  # The contract between the app and the CLI, end to end: start the real
  # `gnomon dashboard` from this checkout, read the link from its stdout, sign
  # in over HTTP exactly as the page does, see the link refused a second time,
  # stop it and find the port closed.
  real-cli:
    name: Against the real gnomon dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Sign in and stop
        working-directory: packages/gnomon-desktop
        env:
          GNOMON_DESKTOP_TEST_CLI: ${{ github.workspace }}/packages/gnomon-cli/gnomon.js
        run: cargo test -p gnomon-desktop-core --locked --test dashboard_child -- --nocapture

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev patchelf file

      - name: Setup Node.js (runs the pinned Tauri CLI)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Clippy (the Tauri crate)
        working-directory: packages/gnomon-desktop
        run: cargo clippy -p gnomon-desktop --locked -- -D warnings

      - name: Build and bundle
        working-directory: packages/gnomon-desktop/src-tauri
        shell: bash
        # --locked reaches cargo: the build uses Cargo.lock as committed.
        run: npx --yes "$TAURI_CLI" build --ci --bundles ${{ matrix.bundles }} -- --locked

      - name: Sizes
        shell: bash
        working-directory: packages/gnomon-desktop/target/release
        run: |
          shopt -s nullglob
          {
            echo "### gnomon-desktop on ${{ runner.os }}"
            echo ""
            echo "| File | Bytes | MiB |"
            echo "|---|---:|---:|"
            for f in gnomon-desktop gnomon-desktop.exe bundle/nsis/*.exe bundle/msi/*.msi bundle/dmg/*.dmg bundle/deb/*.deb bundle/appimage/*.AppImage; do
              [ -f "$f" ] || continue   # the two bare names exist on one OS each
              b=$(wc -c < "$f" | tr -d ' ')
              echo "| \`$f\` | $b | $(awk "BEGIN { printf \"%.1f\", $b / 1048576 }") |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The installers only. A .app directory would lose its executable bits in
      # the artifact zip; the .dmg carries it intact.
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnomon-desktop-${{ runner.os }}
          path: |
            packages/gnomon-desktop/target/release/bundle/nsis/*.exe
            packages/gnomon-desktop/target/release/bundle/msi/*.msi
            packages/gnomon-desktop/target/release/bundle/dmg/*.dmg
            packages/gnomon-desktop/target/release/bundle/deb/*.deb
            packages/gnomon-desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
