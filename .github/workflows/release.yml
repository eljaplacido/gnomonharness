# Release — build the native binaries for a tag and attach them to a GitHub
# release.
#
# STATUS, measured 2026-09-02: this workflow has now run on GitHub Actions and
# produced a release. Run 33650778599 (tag v0.1.1) built all three targets and
# drafted the release with its archives attached. The header below used to say
# "never run" and list what was unverified; that list is settled, and what
# settled it is recorded here rather than deleted, because the difference
# between measured and argued is the whole point of the provenance field this
# workflow exists to feed.
#
#   MEASURED, by the run above:
#     - All three targets compile: linux-x64, linux-arm64 (cross-linked from an
#       x64 runner), darwin-arm64.
#     - The runner images have every tool used here.
#     - The release job's token and `gh release create --draft --verify-tag`
#       invocation work; the draft carried 3 archives, 3 .sha256 files and
#       SHA256SUMS.
#     - The version check fails a tag whose number disagrees with the manifests.
#       Not a thought experiment: v0.1.1 was pushed twice against 0.1.0
#       manifests and this step stopped it twice, in under 15 seconds, before
#       anything was built. It is the reason scripts/check-versions.sh exists —
#       see docs/RELEASING.md.
#
#   VERIFIED EARLIER, by running the step's own script locally with the `${{ }}`
#   expressions substituted by hand:
#     - The package step produces the archive it claims: an 8-entry tarball
#       holding gnomon-surface, gnomon-enums, gnomon-edit, gnomon-exec, LICENSE,
#       GNOMON_BUILD and README-BINARIES.txt, plus a .sha256 beside it. The
#       nested heredoc survives YAML block-scalar dedent (the `EOF` lands in
#       column 0) and `\$PWD` reaches the file unexpanded.
#     - The stamp is the shape gnomon-core reads. Run for real:
#       `GNOMON_BUILD=v0.1.0-abc1234` makes `harnessBuild()` return
#       `gnomon/0.1.0+v0.1.0-abc1234`, instead of the git-derived fallback.
#
#   MEASURED 2026-09-07, and this is the line that said "STILL NOT MEASURED:
#   that the published archives run on a machine that is not the runner that
#   built them ... until someone does, 'it builds' is the claim, not 'it works'."
#   Someone did. The v0.2.1 draft's linux-arm64 archive was downloaded onto an
#   aarch64 Linux box that had never run a release build:
#
#     - `sha256sum -c` against the shipped .sha256 → OK.
#     - All four binaries execute. `gnomon-enums` printed the enumerations
#       contract; `gnomon-surface --dir .gnomon` printed a manifest.
#     - It printed surface_hash 65f601c2…f65c4 for this repository's own
#       `.gnomon/` — byte-identical to the locally compiled binary's answer.
#       Cross-machine agreement on the hash is the harness's central claim, and
#       until this it had never been checked across two differently built
#       binaries.
#     - The documented adoption path works verbatim: exporting
#       GNOMON_BIN_OVERRIDE and GNOMON_BUILD from README-BINARIES.txt made
#       `gnomon surface manifest` report build `0.2.1+v0.2.1-a9fec9b`, so the
#       release identifier does travel with the artifact.
#
#   Still not measured: darwin-arm64 and windows-x64 on their own hardware.
#   linux-x64 was downloaded on the same run and is NOT evidence either way —
#   the host was aarch64, so it produced "Exec format error", which says only
#   that a stranger downloading the wrong archive gets a clear failure.
#
# Two deliberate safety properties, because an accidental release is not
# undoable in the way an accidental commit is:
#
#   1. `on: push: tags:` and nothing else. No `workflow_dispatch`, no branch
#      push, no `pull_request`. This file cannot fire except by someone pushing
#      a tag on purpose. CI (ci.yml) is what runs on branches and PRs.
#   2. The release is created as a **draft**. A tag push builds and uploads;
#      a human presses Publish. Remove `--draft` from the `gh release create`
#      call below to change that, and understand that you are removing the last
#      step where a mistaken tag can still be caught.
#
# Since the supply-chain change (docs/RELEASING.md → "Provenance, SBOM and
# verification"): the build matrix and the npm pack moved to
# build-release.yml, a reusable workflow that attests every artifact in the
# job that builds it. That is the SLSA Build L3 path GitHub documents. The
# history above describes the same build steps, which moved unchanged. This
# file now verifies tags, calls that workflow, checks that every asset's
# provenance verifies, and drafts the release. The one job here that can write
# a release runs no build code.

name: Release

on:
  push:
    tags:
      # Tags only. Matching `v*` and not `*` so that a non-release tag
      # (`baseline-2026-08-30`, a benchmark marker) does not build a release.
      - "v*"

# Read-only by default; only the job that creates the release is given write,
# and it is the only job that ever holds a token that can publish anything.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  verify:
    name: Verify the tag matches the declared version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      stamp: ${{ steps.v.outputs.stamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The failure this job prevents: a tag whose number disagrees with the
      # version in the tree. `harnessBuild()` in gnomon-core composes its string
      # from package.json's version, NOT from the tag — so tagging v0.2.0 with
      # 0.1.0 still in the manifests produces records that say
      # `gnomon/0.1.0+v0.2.0-<sha>`, and provenance that contradicts itself is
      # worse than provenance that is missing. Fail here, before anything is
      # built or uploaded.
      - name: Check versions agree
        id: v
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Every manifest, not just the root. This step used to read Cargo.toml
          # and ./package.json only — but harnessBuild() stamps records with
          # *gnomon-core's* package.json version, so the one file whose version
          # actually reaches a published record was the one the release gate
          # never read. The golden fixtures embed it too, and a stale golden
          # fails conformance only after the binaries are built.
          #
          # The check lives in a script so it can be run locally and from
          # .gnomon/ci.sh, rather than existing only inside a workflow nobody
          # can execute before pushing a tag. `scripts/bump-version.sh` is the
          # other half: it updates all of them at once.
          scripts/check-versions.sh "$version"

          # The provenance identifier. gnomon-core reads GNOMON_BUILD from the
          # environment and renders `gnomon/<package version>+<this value>`, so
          # this becomes e.g. `gnomon/0.1.0+v0.1.0-abf40c0`: the release a user
          # installed AND the commit it was cut from, which the git fallback
          # cannot give you once the repository is gone.
          echo "version=$version"                          >> "$GITHUB_OUTPUT"
          echo "stamp=${tag}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The four native archives, the four npm tarballs, SHA256SUMS, the SBOM and
  # the attestation bundle file. All of it is built AND attested in
  # build-release.yml; see that file for why it is a separate, reusable
  # workflow. A called workflow gets no more than the permissions granted here.
  build:
    name: Build and attest
    needs: [verify]
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: read
      id-token: write       # Sigstore signing certificates for the attestations
      attestations: write   # store the attestations on this repository
    with:
      version: ${{ needs.verify.outputs.version }}
      stamp: ${{ needs.verify.outputs.stamp }}

  # ---------------------------------------------------------------------------
  # The check a user runs, run here first: every checksum matches, and every
  # archive, tarball, SHA256SUMS and the SBOM carries provenance signed by
  # build-release.yml at THIS tag, both in GitHub's attestation store and in
  # the bundle file about to be attached. A build whose provenance does not
  # verify stops here, before a draft exists for anyone to publish. Its own
  # job, read-only, so the token that can write a release is never handed to
  # it.
  check:
    name: Verify checksums and provenance before drafting
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read    # scripts/verify-release.sh asks the attestation API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download every artifact the build produced
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Verify, exactly as scripts/verify-release.sh does for users
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash scripts/verify-release.sh "$VERSION" --dir dist

  # ---------------------------------------------------------------------------
  release:
    name: Draft the GitHub release
    needs: [verify, build, check]
    runs-on: ubuntu-latest
    # The only job with a token that can write anything. It builds nothing:
    # the npm pack that used to run here (pnpm install and every package's
    # build script, under contents: write) moved to build-release.yml.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download every artifact the build produced
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # npm publish is NOT a step here, deliberately. This job ends at a draft,
      # and a draft is not a decision to ship. The publish runs in
      # publish-npm.yml, on `release: published` — after a human has pressed
      # Publish on this draft — and it publishes these exact tarballs, checked
      # against SHA256SUMS, rather than packing again.

      # No third-party release action. The token that can publish a release is
      # the most privileged thing in this repository's CI, and `gh` is already
      # on the runner — handing that token to an action outside this workspace
      # would sit badly in a project whose security policy advertises zero
      # third-party runtime dependencies.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          STAMP: ${{ needs.verify.outputs.stamp }}
        run: |
          set -euo pipefail
          ls -l dist
          # SHA256SUMS is written (and attested) by build-release.yml now, from
          # the same command that used to run here.

          notes=$(cat <<EOF
          Native binaries for gnomon $VERSION.

          **Build identifier:** \`$STAMP\` — records produced with
          \`GNOMON_BUILD=$STAMP\` exported resolve their provenance field to
          \`gnomon/$VERSION+$STAMP\`. See \`README-BINARIES.txt\` in each
          archive, and \`docs/CONTRACTS.md\` §3b for what that field is for.

          Each archive contains gnomon-surface, gnomon-enums, gnomon-edit and
          gnomon-exec. Verify with \`SHA256SUMS\`.

          **Provenance and SBOM.** Every archive and npm tarball, \`SHA256SUMS\`
          and the SBOM (\`gnomon-$VERSION.spdx.json\`) carry a signed SLSA build
          provenance attestation from
          \`.github/workflows/build-release.yml\` at this tag;
          \`gnomon-$VERSION.intoto.jsonl\` holds every bundle. Check all of it
          with \`scripts/verify-release.sh $VERSION\` from a checkout, or one
          file with a current \`gh\`:

          \`\`\`
          gh attestation verify <file> --repo ${{ github.repository }} --cert-identity https://github.com/${{ github.repository }}/.github/workflows/build-release.yml@${{ github.ref }}
          \`\`\`

          ## Install or update

          Node >= 22 and nothing else. The installer verifies every download
          against \`SHA256SUMS\` and puts the native binaries where gnomon finds
          them with no environment variable:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.sh | sh
          \`\`\`
          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.ps1 | iex
          \`\`\`

          Then \`gnomon setup\` scans the machine, recommends a model and
          writes \`.gnomon/\` on your yes; \`gnomon dashboard\` does the same
          in the browser. To run setup straight after installing (it still
          asks before every download and write):
          \`sh -s -- --setup\` in place of \`sh\` above, or in PowerShell
          \`& ([scriptblock]::Create((irm https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/install.ps1))) -Setup\`.

          Already installed: \`gnomon update\`.

          From npm — published from this release's own tarballs when the
          release is published:

          \`\`\`
          npm i -g gnomon-harness@$VERSION
          \`\`\`

          By hand from this release, no registry (one line, identical in bash
          and PowerShell):

          \`\`\`
          npm i -g https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/gnomon-core-$VERSION.tgz https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/gnomon-natives-$VERSION.tgz https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/gnomon-tui-$VERSION.tgz https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/gnomon-harness-$VERSION.tgz
          \`\`\`

          Then \`gnomon setup\` and \`cd my-project && gnomon launch\`. That covers \`launch\`,
          \`prompt\`, \`task\` and \`init\`; \`surface\`, \`enumerations\`,
          \`session\`, \`apply\` and \`simulate\` additionally want the native
          archive above, unpacked into \`~/.local/share/gnomon/bin\`
          (\`%LOCALAPPDATA%\\gnomon\\bin\` on Windows) — which the installer
          does for you.

          Changes: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          EOF
          )

          # --draft: the tag builds and uploads, a human publishes. --verify-tag
          # refuses to create a release for a tag that is not on the remote.
          gh release create "${{ github.ref_name }}" \
            --draft \
            --verify-tag \
            --title "gnomon ${{ github.ref_name }}" \
            --notes "$notes" \
            dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS dist/*.tgz \
            dist/*.spdx.json dist/*.intoto.jsonl
