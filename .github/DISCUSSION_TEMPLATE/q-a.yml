title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Ask anything about using gnomon. Two things often answer it faster:
        - [docs/GUIDE.md](https://github.com/eljaplacido/gnomonharness/blob/master/docs/GUIDE.md): quick start, model recipes, troubleshooting, FAQ.
        - `/explain <topic>` inside gnomon, which reads *your* surface (`/explain endpoints`, `/explain approval`).

        **Never paste an API key.**
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you tried.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gnomon --version
      placeholder: gnomon/0.3.1+npm
  - type: input
    id: setup
    attributes:
      label: OS and model endpoint
      description: For example "macOS arm64, Ollama local" or "Windows, OpenRouter".
  - type: textarea
    id: startup
    attributes:
      label: Startup output (optional)
      description: The output of `echo /quit | gnomon prompt` from your project. It makes no model call.
      render: text
