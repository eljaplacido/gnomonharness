[package]
name = "gnomon-surface"
version = "0.1.0"
edition = "2021"
description = "Resolve + hash config, emit manifests. Static aarch64 binary."

[[bin]]
name = "gnomon-surface"
path = "src/main.rs"

[dependencies]
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2.5"

[profile.release]
opt-level = 2
lto = true
strip = true
