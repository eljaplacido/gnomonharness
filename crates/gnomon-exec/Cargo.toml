[package]
name = "gnomon-exec"
version = "0.1.0"
edition = "2021"
description = "Spawn, timeout, sandbox, outcome capture."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

[profile.release]
opt-level = 3
